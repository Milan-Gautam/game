<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kathmandu Run - Yeti Chase</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { 
            background:#000; overflow:hidden; height:100vh; width:100vw;
            font-family:'Georgia',serif; touch-action:none;
            -webkit-touch-callout:none; user-select:none; -webkit-user-select:none;
        }
        canvas { display:block; position:fixed; top:0; left:0; }
        #ui {
            position:fixed; top:15px; left:0; right:0; display:flex;
            justify-content:space-between; padding:0 15px; pointer-events:none; z-index:10;
        }
        .hud {
            background:rgba(10,5,0,0.8); color:#ffd700; padding:10px 18px;
            border-radius:10px; font-size:15px; font-weight:bold;
            border:1px solid rgba(255,215,0,0.4);
        }
        #gameover {
            position:fixed; top:0; left:0; right:0; bottom:0;
            background:rgba(0,0,0,0.9); display:none; justify-content:center;
            align-items:center; z-index:100;
        }
        #gameover.show { display:flex; }
        .go-card {
            background:#1a1510; border:2px solid rgba(200,50,50,0.6);
            border-radius:20px; padding:30px 40px; text-align:center; color:#e8d5b0;
        }
        .go-card h2 { color:#e85050; font-size:34px; margin-bottom:15px; }
        .go-card p { font-size:18px; margin:5px 0; }
        .go-card button {
            padding:12px 35px; font-size:16px; background:#c0392b; color:#fff;
            border:none; border-radius:25px; cursor:pointer; margin-top:15px; font-weight:bold;
        }
        #vignette {
            position:fixed; inset:0; pointer-events:none; z-index:5;
            background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 45%, rgba(5,3,10,0.75) 100%);
        }
        #loading {
            position:fixed; inset:0; background:#05040a; z-index:200; display:flex;
            flex-direction:column; align-items:center; justify-content:center; color:#ffd700;
            font-size:14px; letter-spacing:0.5px; transition:opacity 0.6s ease; text-align:center;
        }
        #loading .peak { font-size:40px; margin-bottom:14px; filter:drop-shadow(0 0 10px rgba(255,215,0,0.4)); }
        #loadingText { margin-top:8px; color:#c9a877; font-size:12px; }
    </style>
</head>

        // ============================================================
        // PROCEDURAL TEXTURES - still used for the road, sidewalks,
        // sky, mountains, prayer-flag cloth and the yeti's fur. Canvas
        // generated so the file stays dependency-free.
        // ============================================================
        function makeCanvas(size=256) {
            const c = document.createElement('canvas');
            c.width = c.height = size;
            return c;
        }

        function cobbleTexture() {
            const c = makeCanvas(256), ctx = c.getContext('2d');
            ctx.fillStyle = '#38383b';
            ctx.fillRect(0, 0, 256, 256);
            for(let i=0; i<280; i++) {
                const x = Math.random()*256, y = Math.random()*256, r = 6+Math.random()*8;
                const l = 28+Math.random()*22;
                ctx.fillStyle = `hsl(30,5%,${l}%)`;
                ctx.beginPath(); ctx.ellipse(x, y, r, r*0.8, Math.random()*Math.PI, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1; ctx.stroke();
            }
            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        function clothTexture(hex, stripe=false) {
            const c = makeCanvas(32), ctx = c.getContext('2d');
            ctx.fillStyle = hex;
            ctx.fillRect(0, 0, 32, 32);
            if(stripe) {
                ctx.strokeStyle = 'rgba(255,255,255,0.35)';
                ctx.lineWidth = 2;
                for(let i=-32; i<32; i+=6) { ctx.beginPath(); ctx.moveTo(i,32); ctx.lineTo(i+32,0); ctx.stroke(); }
            }
            for(let i=0; i<80; i++) {
                ctx.fillStyle = `rgba(255,255,255,${Math.random()*0.08})`;
                ctx.fillRect(Math.random()*32, Math.random()*32, 1, 1);
            }
            return new THREE.CanvasTexture(c);
        }

        function furTexture(hex, grimy=false) {
            const c = makeCanvas(128), ctx = c.getContext('2d');
            ctx.fillStyle = hex;
            ctx.fillRect(0, 0, 128, 128);
            for(let i=0; i<420; i++) {
                const x = Math.random()*128, y = Math.random()*128;
                ctx.strokeStyle = grimy ? `rgba(50,45,40,${Math.random()*0.15})` : `rgba(0,0,0,${Math.random()*0.1})`;
                ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x+(Math.random()-0.5)*4, y+6+Math.random()*5); ctx.stroke();
            }
            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(2, 2);
            return tex;
        }

        function skyGradientTexture() {
            const c = document.createElement('canvas');
            c.width = 2; c.height = 256;
            const ctx = c.getContext('2d');
            const grad = ctx.createLinearGradient(0, 0, 0, 256);
            grad.addColorStop(0, '#04050d');
            grad.addColorStop(0.32, '#12102c');
            grad.addColorStop(0.6, '#332a4d');
            grad.addColorStop(0.82, '#6a4459');
            grad.addColorStop(1, '#b8724a');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 2, 256);
            return new THREE.CanvasTexture(c);
        }

        function blobShadowTexture() {
            const c = makeCanvas(128), ctx = c.getContext('2d');
            const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
            g.addColorStop(0, 'rgba(0,0,0,0.55)');
            g.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, 128, 128);
            return new THREE.CanvasTexture(c);
        }

        // ============================================================
        // HIMALAYAN SKYLINE
        // ============================================================
        function createMountainRange(dist, spread, baseH, rockColor, snowColor, count, opacity) {
            const group = new THREE.Group();
            const rockMat = new THREE.MeshStandardMaterial({ color: rockColor, roughness: 1, transparent: opacity<1, opacity });
            const snowMat = new THREE.MeshStandardMaterial({ color: snowColor, roughness: 0.6, emissive: 0x223047, emissiveIntensity: 0.18, transparent: opacity<1, opacity });
            for(let i=0; i<count; i++) {
                const t = i/(count-1);
                const centerBoost = Math.max(0, 1-Math.abs(t-0.5)*1.7);
                const h = baseH + centerBoost*baseH*1.1 + Math.random()*baseH*0.3;
                const r = baseH*0.42 + Math.random()*baseH*0.22;
                const x = (t-0.5)*spread + (Math.random()-0.5)*spread*0.05;
                const z = dist - Math.random()*30;
                const sides = 5 + Math.floor(Math.random()*2);
                const cone = new THREE.Mesh(new THREE.ConeGeometry(r, h, sides), rockMat);
                cone.position.set(x, h/2-2, z);
                cone.rotation.y = Math.random()*Math.PI;
                group.add(cone);
                const cap = new THREE.Mesh(new THREE.ConeGeometry(r*0.4, h*0.42, sides), snowMat);
                cap.position.set(x, h*0.8-2, z);
                cap.rotation.y = cone.rotation.y;
                group.add(cap);
            }
            scene.add(group);
            return group;
        }
        createMountainRange(-170, 220, 34, 0x2e2740, 0xdfe6f0, 15, 1);
        createMountainRange(-130, 190, 20, 0x241f38, 0xc7cfe0, 12, 0.85);

            ctx.fillStyle = g; ctx.fillRect(0,0,64,64);
            return new THREE.CanvasTexture(c);
        })();
        for(let i=0; i<3; i++) {

            blob.rotation.x = -Math.PI/2;
            blob.position.y = 0.015;
            scene.add(blob);
            return blob;
        }

        // ============================================================
        // MODEL LOADING
        // ============================================================
        const loader = new GLTFLoader();
        function loadURL(url) { return loader.loadAsync(url); }
        function b64ToBuffer(b64) {
            const binary = atob(b64);
            const bytes = new Uint8Array(binary.length);
            for(let i=0; i<binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return bytes.buffer;
        }
        function loadB64(b64) {
            return new Promise((resolve, reject) => loader.parse(b64ToBuffer(b64), '', resolve, reject));
        }

        const loadingTextEl = document.getElementById('loadingText');
        const TOTAL_ASSETS = 10;
        let loadedCount = 0;
        function markLoaded(label) {
            loadedCount++;
            if(loadingTextEl) loadingTextEl.textContent = `${label} (${loadedCount}/${TOTAL_ASSETS})`;
        }
        function tap(promise, label) {
            return promise.then(g => { markLoaded(label); return g; });
        }

        async function boot() {
            try {
                const [soldier, flamingo, parrot, stork, house0, house1, house2, pagoda, lamp, chaitya] = await Promise.all([
                    tap(loadURL(SOLDIER_URL), 'runner'),
                    tap(loadURL(FLAMINGO_URL), 'flamingo'),
                    tap(loadURL(PARROT_URL), 'parrot'),
                    tap(loadURL(STORK_URL), 'stork'),
                    tap(loadB64(HOUSE0_B64), 'house'),
                    tap(loadB64(HOUSE1_B64), 'house'),
                    tap(loadB64(HOUSE2_B64), 'house'),
                    tap(loadB64(PAGODA_B64), 'temple'),
                    tap(loadB64(LAMP_B64), 'lamp'),
                    tap(loadB64(CHAITYA_B64), 'shrine'),
                ]);
                initWorld({ soldier, flamingo, parrot, stork, house0, house1, house2, pagoda, lamp, chaitya });
            } catch(err) {
                console.error('Model load failed:', err);
                if(loadingTextEl) loadingTextEl.textContent = 'Could not load 3D models - check your connection and reload.';
            }
        }

        window.addEventListener('resize', () => {
            camera.aspect = innerWidth/innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
            composer.setSize(innerWidth, innerHeight);
            bloomPass.setSize(innerWidth, innerHeight);
        });

        // ============================================================
        // EVERYTHING BELOW RUNS ONCE THE REAL MODELS HAVE LOADED
        // ============================================================
        function initWorld(assets) {

            function prepModel(root, overrides={}) {
                root.traverse(o => {
                    if(o.isMesh) {
                        o.material = overrides[o.name] || bakedMat;
                        o.castShadow = true;
                        o.receiveShadow = true;
                    }
                });
                return root;
            }

            const house0Template = prepModel(assets.house0.scene);
            const house1Template = prepModel(assets.house1.scene);
            const house2Template = prepModel(assets.house2.scene);
            const pagodaTemplate = prepModel(assets.pagoda.scene, { finial: templeGoldMat });
            const lampTemplate = prepModel(assets.lamp.scene, { housing: lampHousingMat });
            const chaityaTemplate = prepModel(assets.chaitya.scene, { spire: templeGoldMat, harmika: templeGoldMat });
            const houseTemplates = [house0Template, house1Template, house2Template];
            const houseParams = [ {w:3.0,d:2.8,h1:4.2}, {w:3.6,d:3.1,h1:5.4}, {w:2.7,d:3.3,h1:6.4} ];

            function addWindowGlow(inst, variantIdx) {
                const p = houseParams[variantIdx];
                const rows = Math.max(2, Math.floor(p.h1/1.6));
                for(let r=0; r<rows; r++) {
                    if(Math.random()>0.5) continue;
                    const mat = glassMats[Math.floor(Math.random()*glassMats.length)];
                    const glow = new THREE.Mesh(new THREE.PlaneGeometry(0.45,0.55), mat);
                    const gx = (Math.random()-0.5)*p.w*0.55;
                    const gy = 0.9+r*1.4;
                    glow.position.set(gx, gy, p.d/2+0.02);
                    inst.add(glow);
                    const back = glow.clone();
                    back.position.z = -p.d/2-0.02;
                    back.rotation.y = Math.PI;
                    inst.add(back);
                }
            }

            function attachFlags(inst, approxHeight) {
                const pole = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.03,0.04, approxHeight*0.5+2, 8),
                    new THREE.MeshStandardMaterial({color:0x555555, roughness:0.6, metalness:0.3})
                );
                pole.position.set(0.6, approxHeight*0.55, 1.5);
                inst.add(pole);
                for(let i=0; i<5; i++) {
                    const flag = new THREE.Mesh(new THREE.PlaneGeometry(0.32,0.55), flagMats[i]);
                    flag.position.set(0.6, approxHeight*0.85-i*1.3, 1.5);
                    flag.userData.sway = Math.random()*Math.PI*2;
                    inst.add(flag);
                    allDecor.push(flag);
                }
            }

            // ============================================================
            // GAME STATE
            // ============================================================
            const GRAVITY = 22;
            const JUMP_FORCE = 10;
            const state = {
                score:0, coins:0, speed:16, baseSpeed:16, maxSpeed:50,
                lane:1, targetLane:1, lanes:[-3.2, 0, 3.2],
                jumping:false, sliding:false, velY:0, groundY:0,
                alive:true, invincible:60,
                distance:0, curveAmount:0, targetCurve:0, turnTimer:5,
                yetiDist:18, yetiMinDist:2.5,
                bestScore: parseInt(localStorage.getItem('ktmBest')||'0')
            };

            // ============================================================
            // ROAD SYSTEM
            // ============================================================
            const SEG_LEN = 35, NUM_SEG = 14;
            const streetGroup = new THREE.Group();
            scene.add(streetGroup);
            const segments = [], allBuildings = [], allLamps = [], allDecor = [];

            for(let i=0; i<NUM_SEG; i++) {
                const seg = new THREE.Group();
                const zPos = -i*SEG_LEN;

                const road = new THREE.Mesh(
                    new THREE.PlaneGeometry(8, SEG_LEN+1),
                    new THREE.MeshStandardMaterial({ map: cobbleTex, bumpMap: cobbleTex, bumpScale: 0.02, roughness:0.85 })
                );
                road.rotation.x = -Math.PI/2;
                road.position.y = 0.005;
                road.receiveShadow = true;
                seg.add(road);

                for(let s=-1; s<=1; s+=2) {
                    const sw = new THREE.Mesh(
                        new THREE.PlaneGeometry(1.8, SEG_LEN+1),
                        new THREE.MeshStandardMaterial({ map: cobbleTexPlinth, color:0xaaaaaa, roughness:0.85 })
                    );
                    sw.rotation.x = -Math.PI/2;
                    sw.position.set(s*4.9, 0.02, 0);
                    sw.receiveShadow = true;
                    seg.add(sw);

                    const curb = new THREE.Mesh(
                        new THREE.BoxGeometry(0.2, 0.15, SEG_LEN+1),
                        new THREE.MeshStandardMaterial({ color:0x666666, roughness:0.8 })
                    );
                    curb.position.set(s*4, 0.07, 0);
                    curb.receiveShadow = true;
                    seg.add(curb);
                }

                // Occasional road junction with a small real shrine off to the side
                if(Math.random()>0.6) {
                    const jz = -Math.random()*(SEG_LEN-6)-3;
                    const cross = new THREE.Mesh(
                        new THREE.PlaneGeometry(24, 7.5),
                        new THREE.MeshStandardMaterial({ map: cobbleTex, roughness:0.85 })
                    );
                    cross.rotation.x = -Math.PI/2;
                    cross.position.set(0, 0.006, jz);
                    cross.receiveShadow = true;
                    seg.add(cross);

                    const chSide = Math.random()>0.5 ? 1 : -1;
                    const chaityaInst = chaityaTemplate.clone(true);
                    chaityaInst.scale.setScalar(0.85+Math.random()*0.3);
                    chaityaInst.rotation.y = Math.random()*Math.PI*2;
                    chaityaInst.position.set(chSide*10.5, 0, jz);
                    seg.add(chaityaInst);
                    const chLight = new THREE.PointLight(0xffaa55, 1, 6, 2);
                    chLight.position.set(chSide*10.5, 1.6, jz);
                    seg.add(chLight);
                }

                seg.position.z = zPos;
                streetGroup.add(seg);
                segments.push(seg);

                // Buildings - real cloned house / temple models, not boxes
                for(let j=0; j<SEG_LEN; j+=5+Math.random()*4) {
                    for(let s=-1; s<=1; s+=2) {
                        const r = Math.random();
                        let inst;
                        if(r>0.92) {
                            inst = pagodaTemplate.clone(true);
                            inst.rotation.y = Math.random()*Math.PI*2;
                            inst.scale.setScalar(0.85+Math.random()*0.35);
                            inst.position.set(s*8+(Math.random()-0.5)*2, 0, zPos-j);
                        } else if(r>0.2) {
                            const vIdx = Math.floor(Math.random()*3);
                            inst = houseTemplates[vIdx].clone(true);
                            inst.rotation.y = Math.PI/2 + (Math.random()-0.5)*0.5;
                            inst.scale.setScalar(0.9+Math.random()*0.3);
                            addWindowGlow(inst, vIdx);
                            if(Math.random()>0.55) attachFlags(inst, houseParams[vIdx].h1);
                            inst.position.set(s*6.5+(Math.random()-0.5)*2, 0, zPos-j);
                        } else continue;
                        scene.add(inst);
                        allBuildings.push(inst);
                    }
                }

                // Lamps - real cloned lamp model
                for(let j=0; j<SEG_LEN; j+=10) {
                    for(let s=-1; s<=1; s+=2) {
                        const lampInst = lampTemplate.clone(true);
                        lampInst.position.set(s*5.5, 0, zPos-j);
                        scene.add(lampInst);
                        allLamps.push(lampInst);
                        if(Math.random()>0.5) {
                            const lampLight = new THREE.PointLight(0xff9944, 2, 10, 2);
                            lampLight.position.set(0, 3.9, 0);
                            lampInst.add(lampLight);
                        }
                    }
                }
            }

            // ============================================================
            // PLAYER - real rigged/animated character (three.js's own
            // "Soldier" example asset) instead of primitive capsules.
            // NOTE: this base model is a generic soldier-style rig, not a
            // custom Nepali-dressed character - a free asset with that
            // specific costume doesn't exist, and hand-fitting new clothing
            // to someone else's skeleton is a real 3D-art job. If the model
            // ends up facing the camera instead of away, flip the line
            // below between 0 and Math.PI.
            // ============================================================
            const player = new THREE.Group();
            const runnerScene = assets.soldier.scene;
            runnerScene.rotation.y = Math.PI;
            runnerScene.traverse(o => { if(o.isMesh) o.castShadow = true; });
            player.add(runnerScene);
            player.position.set(0, 0, 5);
            scene.add(player);
            const playerShadow = makeShadowBlob(1.1);

            const playerMixer = new THREE.AnimationMixer(runnerScene);
            const runClip = THREE.AnimationClip.findByName(assets.soldier.animations, 'Run');
            const runAction = playerMixer.clipAction(runClip);
            runAction.play();

            // ============================================================
            // YETI - kept as a hand-built procedural creature; no free
            // rigged "yeti/bigfoot" model was reliably available to pull in
            // alongside everything else, so this stays stylized geometry.
            // ============================================================
            const yeti = new THREE.Group();
            const whiteFur = new THREE.MeshStandardMaterial({ map: furTexture('#e8e0d8', false), roughness:0.85 });
            const grayFur = new THREE.MeshStandardMaterial({ map: furTexture('#c8c0b8', true), roughness:0.9 });
            const yetiFaceSkin = new THREE.MeshStandardMaterial({ color:0x8899AA, roughness:0.5 });
            const yetiEyeGlow = new THREE.MeshStandardMaterial({ color:0xFF0000, emissive:0xFF0000, emissiveIntensity:2.0, roughness:0.1 });

            const yetiBody = new THREE.Mesh(new THREE.CapsuleGeometry(0.8, 1.4, 8, 8), whiteFur);
            yetiBody.position.y = 2.5; yetiBody.castShadow = true;
            yeti.add(yetiBody);

            const yetiHead = new THREE.Mesh(new THREE.SphereGeometry(0.55, 16, 16), whiteFur);
            yetiHead.position.y = 3.8; yetiHead.castShadow = true;
            yeti.add(yetiHead);

            const snoutGeo = new THREE.SphereGeometry(0.3, 8, 6);
            snoutGeo.scale(1, 0.7, 0.6);
            yeti.add(new THREE.Mesh(snoutGeo, yetiFaceSkin)).position.set(0, 3.6, -0.4);

            const yetiEyeGeo = new THREE.SphereGeometry(0.09, 8, 6);
            yeti.add(new THREE.Mesh(yetiEyeGeo, yetiEyeGlow)).position.set(-0.18, 3.85, -0.42);
            yeti.add(new THREE.Mesh(yetiEyeGeo, yetiEyeGlow)).position.set(0.18, 3.85, -0.42);
            yeti.add(new THREE.PointLight(0xFF0000, 1, 3)).position.set(0, 3.85, -0.3);

            const hornGeo = new THREE.ConeGeometry(0.15, 0.6, 6);
            const hornMatY = new THREE.MeshStandardMaterial({ color:0xDDDDCC });
            const lHorn = new THREE.Mesh(hornGeo, hornMatY);
            lHorn.position.set(-0.25, 4.1, 0.1); lHorn.rotation.z = 0.35; lHorn.rotation.x = -0.2;
            yeti.add(lHorn);
            const rHorn = new THREE.Mesh(hornGeo, hornMatY);
            rHorn.position.set(0.25, 4.1, 0.1); rHorn.rotation.z = -0.35; rHorn.rotation.x = -0.2;
            yeti.add(rHorn);

            const yetiArmGeo = new THREE.CapsuleGeometry(0.28, 0.9, 4, 8);
            const lYetiArm = new THREE.Mesh(yetiArmGeo, whiteFur);
            lYetiArm.position.set(-0.9, 2.8, 0.3); lYetiArm.rotation.z = 0.45; lYetiArm.castShadow = true;
            yeti.add(lYetiArm);
            const rYetiArm = new THREE.Mesh(yetiArmGeo, whiteFur);
            rYetiArm.position.set(0.9, 2.8, 0.3); rYetiArm.rotation.z = -0.45; rYetiArm.castShadow = true;
            yeti.add(rYetiArm);

            const yetiLegGeo = new THREE.CapsuleGeometry(0.32, 0.8, 4, 8);
            const lYetiLeg = new THREE.Mesh(yetiLegGeo, grayFur);
            lYetiLeg.position.set(-0.4, 1.3, 0); lYetiLeg.castShadow = true;
            yeti.add(lYetiLeg);
            const rYetiLeg = new THREE.Mesh(yetiLegGeo, grayFur);
            rYetiLeg.position.set(0.4, 1.3, 0); rYetiLeg.castShadow = true;
            yeti.add(rYetiLeg);

            yeti.position.set(0, 0, -state.yetiDist);
            yeti.scale.set(1.2, 1.2, 1.2);
            scene.add(yeti);
            const yetiShadow = makeShadowBlob(2.4);

            // ============================================================
            // BIRDS - real animated bird models circling above the town
            // ============================================================
            const birdSources = [
                { gltf: assets.flamingo, targetSize: 1.1 },
                { gltf: assets.parrot,  targetSize: 0.5 },
                { gltf: assets.stork,   targetSize: 1.2 },
            ];
            birdSources.forEach(src => {
                src.gltf.scene.traverse(o => { if(o.isMesh) o.castShadow = false; });
                const box = new THREE.Box3().setFromObject(src.gltf.scene);
                const size = new THREE.Vector3();
                box.getSize(size);
                src.scale = src.targetSize / Math.max(size.x, size.y, size.z, 0.001);
            });
            const birds = [];
            function spawnBird(srcIdx, offX, offY, offZ, phase, speedMul) {
                const src = birdSources[srcIdx];
                const inst = src.gltf.scene.clone(true);
                inst.scale.setScalar(src.scale);
                scene.add(inst);
                const mixer = new THREE.AnimationMixer(inst);
                if(src.gltf.animations && src.gltf.animations.length) {
                    mixer.clipAction(src.gltf.animations[0]).play();
                }
                birds.push({ obj: inst, mixer, offX, offY, offZ, phase, speedMul });
            }
            for(let i=0; i<7; i++) {
                spawnBird(i%3, (Math.random()-0.5)*26, 11+Math.random()*7, (Math.random()-0.5)*26, Math.random()*Math.PI*2, 0.6+Math.random()*0.5);
            }

            // ============================================================
            // OBSTACLES
            // ============================================================
            const obstacles = [];
            function addObstacle(x, z) {
                const types = ['cart', 'bricks', 'pump', 'bike'];
                const type = types[Math.floor(Math.random()*4)];
                const g = new THREE.Group();
                let w, h;

                if(type==='cart') {
                    const body = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.8, 1.5), new THREE.MeshStandardMaterial({ color:0x8B4513, roughness:0.7 }));
                    body.position.y = 0.6; body.castShadow = true;
                    g.add(body);
                    for(let i=0; i<5; i++) {
                        const fruit = new THREE.Mesh(new THREE.SphereGeometry(0.12, 6, 4), new THREE.MeshStandardMaterial({ color:[0xFF6600,0xFFCC00,0xFF3333][i%3], roughness:0.3 }));
                        fruit.position.set((Math.random()-0.5)*0.8, 1.05, (Math.random()-0.5)*1);
                        g.add(fruit);
                    }
                    w=1.4; h=1.5;
                } else if(type==='bricks') {
                    for(let i=0; i<4; i++) {
                        for(let j=0; j<3; j++) {
                            const brick = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.15, 0.2), new THREE.MeshStandardMaterial({ color:0xB8653A, roughness:0.8 }));
                            brick.position.set((j-1)*0.3, i*0.15, (Math.random()-0.5)*0.3);
                            brick.castShadow = true;
                            g.add(brick);
                        }
                    }
                    w=1.0; h=0.7;
                } else if(type==='pump') {
                    const pump = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.35, 1.5, 8), new THREE.MeshStandardMaterial({ color:0x666666, metalness:0.8, roughness:0.4 }));
                    pump.position.y = 0.75; pump.castShadow = true;
                    g.add(pump);
                    w=1.2; h=1.5;
                } else {
                    const bike = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.8, 1.8), new THREE.MeshStandardMaterial({ color:[0xCC3333,0x3366CC,0x333333][Math.floor(Math.random()*3)], roughness:0.3, metalness:0.4 }));
                    bike.position.y = 0.6; bike.castShadow = true;
                    g.add(bike);
                    w=1.0; h=1.2;
                }

                const warn = new THREE.Mesh(new THREE.RingGeometry(w/2+0.1, w/2+0.35, 32), new THREE.MeshBasicMaterial({ color:0xFF4444, side:THREE.DoubleSide, transparent:true, opacity:0.4 }));
                warn.rotation.x = -Math.PI/2;
                warn.position.y = 0.02;
                g.add(warn);

                g.position.set(x, 0, z);
                scene.add(g);
                obstacles.push({ mesh:g, x, z, w, h, passed:false });
            }

            // ============================================================
            // COINS
            // ============================================================
            const coins = [];
            function addCoin(x, y, z) {
                const g = new THREE.Group();
                g.add(new THREE.Mesh(new THREE.SphereGeometry(0.38, 8, 8), new THREE.MeshBasicMaterial({ color:0xFFD700, transparent:true, opacity:0.2 })));
                const coin = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.26, 0.05, 32), new THREE.MeshStandardMaterial({ color:0xFFD700, roughness:0.04, metalness:0.96, emissive:0x553300, emissiveIntensity:0.55 }));
                coin.rotation.x = Math.PI/2; coin.castShadow = true;
                g.add(coin);
                g.position.set(x, y, z);
                scene.add(g);
                coins.push({ mesh:g, x, y, z, collected:false, baseY:y, phase:Math.random()*Math.PI*2 });
            }

            for(let i=0; i<8; i++) addObstacle(state.lanes[Math.floor(Math.random()*3)], -10-i*20);
            for(let i=0; i<35; i++) {
                const l = Math.floor(Math.random()*3);
                addCoin(state.lanes[l]+(Math.random()-0.5)*2, 1.2+Math.random()*1.5, -5-i*5);
            }

            // ============================================================
            // CONTROLS
            // ============================================================
            const keys = {};
            let keyJustPressed = {};

            window.addEventListener('keydown', e => {
                if(!keys[e.code]) keyJustPressed[e.code] = true;
                keys[e.code] = true;
                e.preventDefault();
            });
            window.addEventListener('keyup', e => { keys[e.code] = false; });

            let tsx=0, tsy=0, swipeDone=false;
            renderer.domElement.addEventListener('touchstart', e => {
                tsx = e.touches[0].clientX; tsy = e.touches[0].clientY; swipeDone = false;
                e.preventDefault();
            }, {passive:false});

            renderer.domElement.addEventListener('touchmove', e => {
                if(swipeDone) return;
                const dx = e.touches[0].clientX - tsx;
                const dy = e.touches[0].clientY - tsy;
                if(Math.abs(dx)>18 || Math.abs(dy)>18) {
                    if(Math.abs(dx)>Math.abs(dy)) {
                        if(dx>0) moveRight(); else moveLeft();
                    } else {
                        if(dy<0 && !state.jumping && !state.sliding) { state.jumping=true; state.velY=JUMP_FORCE; }
                        else if(dy>0 && !state.jumping && !state.sliding) state.sliding=true;
                    }
                    swipeDone = true;
                }
                e.preventDefault();
            }, {passive:false});

            function moveLeft() { if(state.lane>0) { state.lane--; state.targetLane=state.lane; } }
            function moveRight() { if(state.lane<2) { state.lane++; state.targetLane=state.lane; } }

            // ============================================================
            // GAME LOOP
            // ============================================================
            let frame = 0;
            let lastTime = performance.now();

            function update(dt) {
                if(!state.alive) return;
                const cDt = Math.min(dt, 0.1);
                frame++;
                if(state.invincible>0) state.invincible--;

                state.distance += state.speed * cDt;
                state.score = Math.floor(state.distance);

                if(state.distance>30) {
                    state.speed = state.baseSpeed + (state.distance-30)*0.04;
                    state.speed = Math.min(state.speed, state.maxSpeed);
                }

                const yetiSpeed = state.speed * 0.88;
                state.yetiDist += (yetiSpeed - state.speed) * cDt;
                state.yetiDist = Math.max(state.yetiMinDist, Math.min(23, state.yetiDist));

                state.turnTimer -= cDt;
                if(state.turnTimer<=0 && Math.abs(state.targetCurve)<0.1) {
                    state.turnTimer = 4 + Math.random()*6;
                    state.targetCurve = (Math.random()-0.5)*6;
                }
                state.curveAmount += (state.targetCurve - state.curveAmount)*2*cDt;
                if(Math.abs(state.curveAmount-state.targetCurve)<0.05) state.targetCurve*=0.97;

                if(keyJustPressed['ArrowLeft']||keyJustPressed['KeyA']) moveLeft();
                if(keyJustPressed['ArrowRight']||keyJustPressed['KeyD']) moveRight();
                if((keyJustPressed['ArrowUp']||keyJustPressed['KeyW']||keyJustPressed['Space']) && !state.jumping && !state.sliding) {
                    state.jumping=true; state.velY=JUMP_FORCE;
                }
                if((keyJustPressed['ArrowDown']||keyJustPressed['KeyS']) && !state.jumping && !state.sliding) state.sliding=true;
                keyJustPressed = {};

                const targetX = state.lanes[state.targetLane] + state.curveAmount;
                player.position.x += (targetX - player.position.x)*10*cDt;

                if(state.jumping) {
                    player.position.y += state.velY*cDt;
                    state.velY -= GRAVITY*cDt;
                    if(player.position.y<=state.groundY) {
                        player.position.y=state.groundY; state.jumping=false; state.velY=0;
                    }
                }
                if(!state.jumping && !state.sliding) {
                    const cycle = performance.now()*0.001*state.speed*0.4;
                    player.position.y = state.groundY + Math.abs(Math.sin(cycle*2))*0.02;
                }

                // Real running animation, sped up/slowed down with game speed
                runAction.timeScale = state.speed/state.baseSpeed;
                playerMixer.update(cDt);

                if(state.sliding) {
                    player.scale.y = 0.4; player.position.y = -0.58;
                    if(!keys['ArrowDown']&&!keys['KeyS']) { state.sliding=false; player.scale.y=1; player.position.y=state.groundY; }
                }

                playerShadow.position.set(player.position.x, 0.015, player.position.z);
                playerShadow.scale.setScalar(Math.max(0.4, 1-player.position.y*0.15));
                yetiShadow.position.set(yeti.position.x, 0.015, yeti.position.z);

                yeti.position.z = player.position.z - state.yetiDist;
                yeti.position.x += (player.position.x*0.8 - yeti.position.x)*5*cDt;
                yeti.position.y = 0;
                lYetiArm.rotation.z = 0.45 + Math.sin(performance.now()*0.004)*0.25;
                rYetiArm.rotation.z = -0.45 - Math.sin(performance.now()*0.004+1)*0.25;
                lYetiLeg.rotation.x = Math.sin(performance.now()*0.005)*0.3;
                rYetiLeg.rotation.x = -Math.sin(performance.now()*0.005)*0.3;

                // Birds - loose circling flight around the player
                const bt = performance.now()*0.00018;
                for(const b of birds) {
                    b.mixer.update(cDt);
                    const ang = bt*b.speedMul*10 + b.phase;
                    b.obj.position.set(
                        player.position.x + b.offX + Math.sin(ang)*10,
                        b.offY + Math.sin(ang*1.6)*1.4,
                        player.position.z + b.offZ + Math.cos(ang)*10
                    );
                    b.obj.rotation.y = -ang - Math.PI/2;
                }

                const move = state.speed*cDt;
                for(let seg of segments) {
                    seg.position.z += move;
                    seg.position.x = Math.sin(seg.position.z*0.012+state.distance*0.0015)*3 + state.curveAmount*0.4;
                    if(seg.position.z>SEG_LEN) seg.position.z -= NUM_SEG*SEG_LEN;
                }
                for(let b of allBuildings) { b.position.z+=move; if(b.position.z>15) b.position.z-=NUM_SEG*SEG_LEN+30; }
                for(let l of allLamps) { l.position.z+=move; if(l.position.z>15) l.position.z-=NUM_SEG*SEG_LEN+30; }
                for(let f of allDecor) { f.rotation.z = Math.sin(performance.now()*0.0015+f.userData.sway)*0.15; }

                for(let obs of obstacles) {
                    obs.mesh.position.z += move; obs.z = obs.mesh.position.z;
                    obs.mesh.position.x = obs.x + Math.sin(obs.z*0.012+state.distance*0.0015)*3 + state.curveAmount*0.4;
                }
                for(let i=obstacles.length-1; i>=0; i--) {
                    if(obstacles[i].z>12) { scene.remove(obstacles[i].mesh); obstacles.splice(i,1); }
                }

                for(let coin of coins) {
                    coin.mesh.position.z += move; coin.z = coin.mesh.position.z;
                    coin.mesh.rotation.z += 2.5*cDt;
                    coin.mesh.position.y = coin.baseY + Math.sin(performance.now()*0.004+coin.phase)*0.12;
                }
                for(let i=coins.length-1; i>=0; i--) {
                    if(coins[i].z>12 || coins[i].collected) { scene.remove(coins[i].mesh); coins.splice(i,1); }
                }

                if(Math.random() < Math.max(0.4, 3-state.speed*0.06)*cDt) {
                    addObstacle(state.lanes[Math.floor(Math.random()*3)], -NUM_SEG*SEG_LEN+5);
                }
                if(Math.random() < 2.8*cDt) {
                    const l = Math.floor(Math.random()*3);
                    addCoin(state.lanes[l]+(Math.random()-0.5)*2, 1.2+Math.random()*1.4, -NUM_SEG*SEG_LEN+5);
                }
                if(frame%22===0 && Math.random()>0.35) {
                    const l = Math.floor(Math.random()*3);
                    for(let i=0; i<6; i++) addCoin(state.lanes[l], 1.5, -NUM_SEG*SEG_LEN+5+i*1.5);
                }

                const px = player.position.x, py = player.position.y, pz = player.position.z;
                const pBot = state.sliding ? -0.58 : py;
                const pTop = state.sliding ? -0.17 : py + 1.85;

                for(let obs of obstacles) {
                    const dx = Math.abs(px - obs.mesh.position.x);
                    const dz = Math.abs(pz - obs.z);
                    if(dx < obs.w/2+0.25 && dz < 0.5) {
                        if(state.jumping && pBot > obs.h-0.1) continue;
                        if(pTop > obs.h*0.3 && state.invincible<=0) {
                            state.alive = false;
                            endGame();
                            return;
                        }
                    }
                    if(!obs.passed && obs.z>pz+1) { obs.passed=true; state.score+=10; }
                }

                if(state.yetiDist < state.yetiMinDist) { state.alive=false; endGame(); return; }

                for(let coin of coins) {
                    if(coin.collected) continue;
                    if(Math.abs(px-coin.x)<0.5 && Math.abs((py+1.3)-coin.mesh.position.y)<0.7 && Math.abs(pz-coin.z)<0.5) {
                        coin.collected=true; state.coins++; state.score+=15;
                    }
                }

                camera.position.x += (player.position.x*0.3 - camera.position.x)*4*cDt;
                camera.position.y += (8.5+player.position.y - camera.position.y)*4*cDt;
                camera.lookAt(player.position.x*0.2, 2.3, player.position.z-7);

                document.getElementById('score').textContent = Math.floor(state.score);
                document.getElementById('coins').textContent = state.coins;
            }

            function endGame() {
                const fs = Math.floor(state.score);
                if(fs > state.bestScore) {
                    state.bestScore = fs;
                    localStorage.setItem('ktmBest', state.bestScore);
                }
                document.getElementById('fs').textContent = fs+'m';
                document.getElementById('fc').textContent = state.coins;
                document.getElementById('bs').textContent = state.bestScore+'m';
                document.getElementById('gameover').classList.add('show');
            }

            function animate(ts) {
                requestAnimationFrame(animate);
                const dt = (ts - lastTime)/1000;
                lastTime = ts;
                if(dt>0 && dt<0.5) update(dt);
                composer.render();
            }

            requestAnimationFrame(animate);
            const loadingEl = document.getElementById('loading');
            loadingEl.style.opacity = '0';
            setTimeout(() => loadingEl.remove(), 650);
            console.log('🏔️ Kathmandu Run Ready! (real glTF models: runner, birds, houses, temple, lamp, shrine)');
            console.log('Arrow Keys/WASD to move, Space to jump, Down to slide');
            console.log('Mobile: Swipe to play');
        }

        boot();
    </script>
</body>
</html>
