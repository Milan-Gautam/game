<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kathmandu Run - Yeti Chase</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { 
            background:#000; overflow:hidden; height:100vh; width:100vw;
            font-family:'Georgia',serif; touch-action:none;
            -webkit-touch-callout:none; user-select:none; -webkit-user-select:none;
        }
        canvas { display:block; position:fixed; top:0; left:0; }
        #ui {
            position:fixed; top:15px; left:0; right:0; display:flex;
            justify-content:space-between; padding:0 15px; pointer-events:none; z-index:10;
        }
        .hud {
            background:rgba(10,5,0,0.8); color:#ffd700; padding:10px 18px;
            border-radius:10px; font-size:15px; font-weight:bold;
            border:1px solid rgba(255,215,0,0.4);
        }
        #gameover {
            position:fixed; top:0; left:0; right:0; bottom:0;
            background:rgba(0,0,0,0.9); display:none; justify-content:center;
            align-items:center; z-index:100;
        }
        #gameover.show { display:flex; }
        .go-card {
            background:#1a1510; border:2px solid rgba(200,50,50,0.6);
            border-radius:20px; padding:30px 40px; text-align:center; color:#e8d5b0;
        }
        .go-card h2 { color:#e85050; font-size:34px; margin-bottom:15px; }
        .go-card p { font-size:18px; margin:5px 0; }
        .go-card button {
            padding:12px 35px; font-size:16px; background:#c0392b; color:#fff;
            border:none; border-radius:25px; cursor:pointer; margin-top:15px; font-weight:bold;
        }
        #vignette {
            position:fixed; inset:0; pointer-events:none; z-index:5;
            background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 45%, rgba(5,3,10,0.75) 100%);
        }
        #loading {
            position:fixed; inset:0; background:#05040a; z-index:200; display:flex;
            flex-direction:column; align-items:center; justify-content:center; color:#ffd700;
            font-size:15px; letter-spacing:0.5px; transition:opacity 0.6s ease;
        }
        #loading .peak { font-size:40px; margin-bottom:14px; filter:drop-shadow(0 0 10px rgba(255,215,0,0.4)); }
    </style>
</head>
<body>
    <div id="loading"><div class="peak">🏔️</div>Entering the streets of Kathmandu…</div>
    <div id="vignette"></div>
    <div id="ui">
        <div class="hud">Distance: <span id="score">0</span>m</div>
        <div class="hud">Rupees: <span id="coins">0</span></div>
    </div>
    <div id="gameover">
        <div class="go-card">
            <h2>🏔️ The Yeti Got You!</h2>
            <p>Distance: <span id="fs">0</span>m</p>
            <p>Rupees: <span id="fc">0</span></p>
            <p>Best: <span id="bs">0</span>m</p>
            <button onclick="location.reload()">Run Again</button>
        </div>
    </div>

    <script type="importmap">
        { "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        } }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

        // ============================================================
        // PROCEDURAL TEXTURES (hand-authored canvas textures - no external
        // image assets, so the game stays a single portable HTML file)
        // ============================================================
        function makeCanvas(size=256) {
            const c = document.createElement('canvas');
            c.width = c.height = size;
            return c;
        }

        function brickTexture(hue=0.03, sat=0.5, light=0.4) {
            const c = makeCanvas(256), ctx = c.getContext('2d');
            const brickH = 22, brickW = 46, mortar = 3;
            ctx.fillStyle = `hsl(${hue*360},${sat*60}%,18%)`;
            ctx.fillRect(0, 0, 256, 256);
            let row = 0;
            for(let y=0; y<256; y+=brickH) {
                const offset = (row%2===0) ? 0 : brickW/2;
                for(let x=-brickW; x<256+brickW; x+=brickW) {
                    const l = light + (Math.random()-0.5)*0.12;
                    ctx.fillStyle = `hsl(${(hue+(Math.random()-0.5)*0.015)*360},${sat*100}%,${l*100}%)`;
                    ctx.fillRect(x+offset+mortar/2, y+mortar/2, brickW-mortar, brickH-mortar);
                }
                row++;
            }
            for(let i=0; i<900; i++) {
                ctx.fillStyle = `rgba(0,0,0,${Math.random()*0.08})`;
                ctx.fillRect(Math.random()*256, Math.random()*256, 2, 2);
            }
            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        function woodTexture(hue=0.08) {
            const c = makeCanvas(128), ctx = c.getContext('2d');
            ctx.fillStyle = `hsl(${hue*360},45%,20%)`;
            ctx.fillRect(0, 0, 128, 128);
            for(let i=0; i<45; i++) {
                ctx.strokeStyle = `hsla(${hue*360},40%,${14+Math.random()*22}%,0.55)`;
                ctx.lineWidth = 1+Math.random()*2;
                ctx.beginPath();
                const x = Math.random()*128;
                ctx.moveTo(x, 0);
                ctx.bezierCurveTo(x+(Math.random()-0.5)*20, 40, x+(Math.random()-0.5)*20, 90, x+(Math.random()-0.5)*10, 128);
                ctx.stroke();
            }
            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        function latticeTexture() {
            const c = makeCanvas(128), ctx = c.getContext('2d');
            ctx.fillStyle = '#2a1d12';
            ctx.fillRect(0, 0, 128, 128);
            ctx.strokeStyle = 'rgba(180,140,80,0.5)';
            ctx.lineWidth = 3;
            for(let x=0; x<=128; x+=16) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,128); ctx.stroke(); }
            for(let y=0; y<=128; y+=16) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(128,y); ctx.stroke(); }
            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        function cobbleTexture() {
            const c = makeCanvas(256), ctx = c.getContext('2d');
            ctx.fillStyle = '#38383b';
            ctx.fillRect(0, 0, 256, 256);
            for(let i=0; i<280; i++) {
                const x = Math.random()*256, y = Math.random()*256, r = 6+Math.random()*8;
                const l = 28+Math.random()*22;
                ctx.fillStyle = `hsl(30,5%,${l}%)`;
                ctx.beginPath(); ctx.ellipse(x, y, r, r*0.8, Math.random()*Math.PI, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1; ctx.stroke();
            }
            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        function roofTileTexture(hue=0.02) {
            const c = makeCanvas(128), ctx = c.getContext('2d');
            ctx.fillStyle = `hsl(${hue*360},50%,23%)`;
            ctx.fillRect(0, 0, 128, 128);
            for(let y=0; y<128; y+=10) {
                for(let x=0; x<128; x+=16) {
                    ctx.fillStyle = `hsl(${hue*360},50%,${20+Math.random()*10}%)`;
                    ctx.beginPath();
                    ctx.arc(x+8, y, 8, 0, Math.PI, true);
                    ctx.fill();
                }
            }
            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        function clothTexture(hex, stripe=false) {
            const c = makeCanvas(32), ctx = c.getContext('2d');
            ctx.fillStyle = hex;
            ctx.fillRect(0, 0, 32, 32);
            if(stripe) {
                ctx.strokeStyle = 'rgba(255,255,255,0.35)';
                ctx.lineWidth = 2;
                for(let i=-32; i<32; i+=6) { ctx.beginPath(); ctx.moveTo(i,32); ctx.lineTo(i+32,0); ctx.stroke(); }
            }
            for(let i=0; i<80; i++) {
                ctx.fillStyle = `rgba(255,255,255,${Math.random()*0.08})`;
                ctx.fillRect(Math.random()*32, Math.random()*32, 1, 1);
            }
            const tex = new THREE.CanvasTexture(c);
            return tex;
        }

        function furTexture(hex, grimy=false) {
            const c = makeCanvas(128), ctx = c.getContext('2d');
            ctx.fillStyle = hex;
            ctx.fillRect(0, 0, 128, 128);
            for(let i=0; i<420; i++) {
                const x = Math.random()*128, y = Math.random()*128;
                ctx.strokeStyle = grimy ? `rgba(50,45,40,${Math.random()*0.15})` : `rgba(0,0,0,${Math.random()*0.1})`;
                ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x+(Math.random()-0.5)*4, y+6+Math.random()*5); ctx.stroke();
            }
            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(2, 2);
            return tex;
        }

        function skyGradientTexture() {
            const c = document.createElement('canvas');
            c.width = 2; c.height = 256;
            const ctx = c.getContext('2d');
            const grad = ctx.createLinearGradient(0, 0, 0, 256);
            grad.addColorStop(0, '#04050d');
            grad.addColorStop(0.32, '#12102c');
            grad.addColorStop(0.6, '#332a4d');
            grad.addColorStop(0.82, '#6a4459');
            grad.addColorStop(1, '#b8724a');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 2, 256);
            const tex = new THREE.CanvasTexture(c);
            return tex;
        }

        function blobShadowTexture() {
            const c = makeCanvas(128), ctx = c.getContext('2d');
            const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
            g.addColorStop(0, 'rgba(0,0,0,0.55)');
            g.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, 128, 128);
            return new THREE.CanvasTexture(c);
        }

        // Shared texture instances (built once, reused everywhere)
        const brickTexA = brickTexture(0.025, 0.55, 0.4); brickTexA.repeat.set(1.4, 1.2);
        const brickTexB = brickTexture(0.06, 0.4, 0.48); brickTexB.repeat.set(1.4, 1.6);
        const brickTexTemple = brickTexture(0.02, 0.5, 0.32); brickTexTemple.repeat.set(1.2, 1);
        const woodTex = woodTexture(0.08); woodTex.repeat.set(2, 2);
        const latticeTex = latticeTexture(); latticeTex.repeat.set(1, 1);
        const cobbleTex = cobbleTexture(); cobbleTex.repeat.set(6, 26);
        const cobbleTexPlinth = cobbleTexture(); cobbleTexPlinth.repeat.set(2, 2);
        const roofTileTex = roofTileTexture(0.02); roofTileTex.repeat.set(3, 3);
        const roofTileTexDark = roofTileTexture(0.0); roofTileTexDark.repeat.set(3, 3);

        // Shared materials (avoids thousands of duplicate GPU programs)
        const frameMat = new THREE.MeshStandardMaterial({ map: latticeTex, roughness: 0.75 });
        const glassMats = [0.25, 0.4, 0.55, 0.7].map(ei => new THREE.MeshStandardMaterial({
            color: 0xFFCC66, emissive: 0xFF9933, emissiveIntensity: ei, roughness: 0.15
        }));
        const flagColorHex = ['#3366CC', '#F5F0E0', '#CC3333', '#3D8C3D', '#E8B838'];
        const flagMats = flagColorHex.map(hex => new THREE.MeshStandardMaterial({
            map: clothTexture(hex), side: THREE.DoubleSide, roughness: 0.5, transparent: true, opacity: 0.88
        }));
        const templeGoldMat = new THREE.MeshStandardMaterial({ color: 0xC9A227, metalness: 0.75, roughness: 0.28, emissive: 0x2a1c00, emissiveIntensity: 0.3 });

        // ============================================================
        // SCENE SETUP
        // ============================================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x120f24);
        scene.fog = new THREE.FogExp2(0x241a30, 0.00013);

        const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.3, 250);
        camera.position.set(0, 8, 14);
        camera.lookAt(0, 2, -6);

        const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:"high-performance" });
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.05;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.appendChild(renderer.domElement);

        // Cinematic bloom pass - makes lamps, windows, the moon, coins and the
        // yeti's eyes glow instead of just being flat bright colors
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.55, 0.78);
        composer.addPass(bloomPass);
        composer.addPass(new OutputPass());

        // ============================================================
        // LIGHTING - Night with moonlight
        // ============================================================
        scene.add(new THREE.AmbientLight(0x1a2040, 0.4));
        
        const moonLight = new THREE.DirectionalLight(0x8899cc, 2.0);
        moonLight.position.set(30, 40, 15);
        moonLight.castShadow = true;
        moonLight.shadow.mapSize.set(2048, 2048);
        moonLight.shadow.camera.near = 0.5;
        moonLight.shadow.camera.far = 150;
        moonLight.shadow.camera.left = -40;
        moonLight.shadow.camera.right = 40;
        moonLight.shadow.camera.top = 40;
        moonLight.shadow.camera.bottom = -40;
        moonLight.shadow.bias = -0.0003;
        scene.add(moonLight);
        
        scene.add(new THREE.HemisphereLight(0x334466, 0x1a1010, 0.3));

        // Warm street lamps
        const warmLight = new THREE.PointLight(0xff8844, 3, 18, 1.5);
        warmLight.position.set(0, 5, 0);
        scene.add(warmLight);
        const warmLight2 = new THREE.PointLight(0xff9944, 2, 14, 1.5);
        warmLight2.position.set(5, 4, -10);
        scene.add(warmLight2);

        // ============================================================
        // SKY - Moon and stars
        // ============================================================
        const moonGeo = new THREE.SphereGeometry(2.5, 32, 32);
        const moonMesh = new THREE.Mesh(moonGeo, new THREE.MeshStandardMaterial({ 
            color:0xeeeedd, roughness:0.3, emissive:0x444433, emissiveIntensity:0.8 
        }));
        moonMesh.position.set(40, 35, -90);
        scene.add(moonMesh);

        // Stars
        const starsGeo = new THREE.BufferGeometry();
        const starsPos = new Float32Array(600 * 3);
        for(let i=0; i<600; i++) {
            starsPos[i*3] = (Math.random()-0.5)*140;
            starsPos[i*3+1] = 18 + Math.random()*55;
            starsPos[i*3+2] = -Math.random()*160;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        scene.add(new THREE.Points(starsGeo, new THREE.PointsMaterial({ 
            color:0xffffff, size:0.18, transparent:true, opacity:0.75 
        })));

        // Dusk sky dome (replaces the flat background color with a gradient horizon)
        const skyDome = new THREE.Mesh(
            new THREE.SphereGeometry(220, 32, 32),
            new THREE.MeshBasicMaterial({ map: skyGradientTexture(), side: THREE.BackSide, fog: false })
        );
        scene.add(skyDome);

        // ============================================================
        // HIMALAYAN SKYLINE - layered peaks far behind the town
        // ============================================================
        function createMountainRange(dist, spread, baseH, rockColor, snowColor, count, opacity) {
            const group = new THREE.Group();
            const rockMat = new THREE.MeshStandardMaterial({ color: rockColor, roughness: 1, transparent: opacity<1, opacity });
            const snowMat = new THREE.MeshStandardMaterial({ color: snowColor, roughness: 0.6, emissive: 0x223047, emissiveIntensity: 0.18, transparent: opacity<1, opacity });
            for(let i=0; i<count; i++) {
                const t = i/(count-1);
                const centerBoost = Math.max(0, 1-Math.abs(t-0.5)*1.7);
                const h = baseH + centerBoost*baseH*1.1 + Math.random()*baseH*0.3;
                const r = baseH*0.42 + Math.random()*baseH*0.22;
                const x = (t-0.5)*spread + (Math.random()-0.5)*spread*0.05;
                const z = dist - Math.random()*30;
                const sides = 5 + Math.floor(Math.random()*2);
                const cone = new THREE.Mesh(new THREE.ConeGeometry(r, h, sides), rockMat);
                cone.position.set(x, h/2-2, z);
                cone.rotation.y = Math.random()*Math.PI;
                group.add(cone);
                const cap = new THREE.Mesh(new THREE.ConeGeometry(r*0.4, h*0.42, sides), snowMat);
                cap.position.set(x, h*0.8-2, z);
                cap.rotation.y = cone.rotation.y;
                group.add(cap);
            }
            scene.add(group);
            return group;
        }
        createMountainRange(-170, 220, 34, 0x2e2740, 0xdfe6f0, 15, 1);
        createMountainRange(-130, 190, 20, 0x241f38, 0xc7cfe0, 12, 0.85);

        // Thin haze bands to seat the mountains into the valley air
        const hazeTex = (function(){
            const c = makeCanvas(64), ctx = c.getContext('2d');
            const g = ctx.createLinearGradient(0,0,0,64);
            g.addColorStop(0, 'rgba(180,190,220,0)');
            g.addColorStop(0.5, 'rgba(180,190,220,0.28)');
            g.addColorStop(1, 'rgba(180,190,220,0)');
            ctx.fillStyle = g; ctx.fillRect(0,0,64,64);
            return new THREE.CanvasTexture(c);
        })();
        for(let i=0; i<3; i++) {
            const haze = new THREE.Mesh(new THREE.PlaneGeometry(260, 14), new THREE.MeshBasicMaterial({ map: hazeTex, transparent: true, depthWrite: false, fog: false }));
            haze.position.set(0, 10+i*7, -140-i*15);
            scene.add(haze);
        }

        // Soft blob-shadow helper (contact shadow under runner & yeti - cheap but reads as grounded/real)
        function makeShadowBlob(size) {
            const blob = new THREE.Mesh(new THREE.PlaneGeometry(size, size), new THREE.MeshBasicMaterial({ map: blobShadowTexture(), transparent: true, depthWrite: false }));
            blob.rotation.x = -Math.PI/2;
            blob.position.y = 0.015;
            scene.add(blob);
            return blob;
        }

        // ============================================================
        // GAME STATE
        // ============================================================
        const GRAVITY = 22;
        const JUMP_FORCE = 10;
        const state = {
            score:0, coins:0, speed:16, baseSpeed:16, maxSpeed:50,
            lane:1, targetLane:1, lanes:[-3.2, 0, 3.2],
            jumping:false, sliding:false, velY:0, groundY:0,
            alive:true, invincible:60,
            distance:0, curveAmount:0, targetCurve:0, turnTimer:5,
            yetiDist:18, yetiMinDist:2.5,
            bestScore: parseInt(localStorage.getItem('ktmBest')||'0')
        };

        // ============================================================
        // ROAD SYSTEM
        // ============================================================
        const SEG_LEN = 35, NUM_SEG = 14;
        const streetGroup = new THREE.Group();
        scene.add(streetGroup);
        const segments = [], allBuildings = [], allLamps = [], allDecor = [];

        // Kathmandu building - Newari brick facade, carved wooden window
        // lattices and a tiled roof, built from shared textures/materials
        // so hundreds of these stay cheap to render.
        function createBuilding(x, z, side) {
            const g = new THREE.Group();
            const stories = 2 + Math.floor(Math.random()*4);
            const h = stories * 2.5;
            const w = 2 + Math.random()*3;
            const d = 2 + Math.random()*3;

            const brickTex = Math.random()>0.5 ? brickTexA : brickTexB;
            const bodyMat = new THREE.MeshStandardMaterial({
                map: brickTex, bumpMap: brickTex, bumpScale: 0.015,
                color: new THREE.Color().setHSL(0.08+Math.random()*0.05, 0.25+Math.random()*0.2, 0.75+Math.random()*0.2),
                roughness: 0.82, metalness: 0.04
            });
            const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), bodyMat);
            body.position.y = h/2;
            body.castShadow = true; body.receiveShadow = true;
            g.add(body);

            // Carved wooden window lattices with warm interior glow
            for(let f=0; f<stories; f++) {
                for(let wx=-w/2+0.8; wx<w/2; wx+=1.5) {
                    const frame = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.9, 0.08), frameMat);
                    frame.position.set(wx, f*2.5+1.3, side*(d/2+0.04));
                    g.add(frame);

                    const glass = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.7, 0.02), glassMats[Math.floor(Math.random()*glassMats.length)]);
                    glass.position.set(wx, f*2.5+1.3, side*(d/2+0.07));
                    g.add(glass);
                }
            }

            // Tiled roof
            if(Math.random()>0.4) {
                const roof = new THREE.Mesh(
                    new THREE.ConeGeometry(w/1.2, 1.2, 4),
                    new THREE.MeshStandardMaterial({ map: roofTileTex, color: 0x9a5a4a, roughness: 0.6 })
                );
                roof.position.y = h+0.6;
                roof.rotation.y = Math.PI/4;
                roof.castShadow = true;
                g.add(roof);
            }

            // Prayer flags
            if(Math.random()>0.5) {
                const pole = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.04, 0.05, h+3, 8),
                    new THREE.MeshStandardMaterial({ color:0x555555, roughness:0.6, metalness:0.3 })
                );
                pole.position.set(side*(w/2+0.3), h/2+1.5, d/2);
                g.add(pole);

                for(let i=0; i<5; i++) {
                    const flag = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 0.7), flagMats[i]);
                    flag.position.set(side*(w/2+0.5), h-i*2, d/2);
                    flag.rotation.y = side*0.4;
                    flag.userData.sway = Math.random()*Math.PI*2;
                    g.add(flag);
                    allDecor.push(flag);
                }
            }

            g.position.set(x, 0, z);
            scene.add(g);
            allBuildings.push(g);
            return g;
        }

        // Nepali pagoda temple - stacked tiered roofs, timber struts and a
        // gilded finial, used sparingly as a landmark building
        function createPagoda(x, z, side) {
            const g = new THREE.Group();
            const plinth = new THREE.Mesh(new THREE.BoxGeometry(5, 0.6, 5), new THREE.MeshStandardMaterial({ map: cobbleTexPlinth, roughness: 0.9 }));
            plinth.position.y = 0.3;
            plinth.receiveShadow = true;
            g.add(plinth);
            for(let s=0; s<3; s++) {
                const step = new THREE.Mesh(new THREE.BoxGeometry(5.6-s*0.5, 0.15, 5.6-s*0.5), new THREE.MeshStandardMaterial({ map: cobbleTexPlinth, roughness: 0.85 }));
                step.position.y = -0.1-s*0.15;
                g.add(step);
            }

        // ============================================================
        // CONTROLS
        // ============================================================
        const keys = {};
        let keyJustPressed = {};

        window.addEventListener('keydown', e => {
            if(!keys[e.code]) keyJustPressed[e.code] = true;
            keys[e.code] = true;
            e.preventDefault();
        });
        window.addEventListener('keyup', e => { keys[e.code] = false; });

        let tsx=0, tsy=0, swipeDone=false;
        renderer.domElement.addEventListener('touchstart', e => {
            tsx = e.touches[0].clientX; tsy = e.touches[0].clientY; swipeDone = false;
            e.preventDefault();
        }, {passive:false});

        renderer.domElement.addEventListener('touchmove', e => {
            if(swipeDone) return;
            const dx = e.touches[0].clientX - tsx;
            const dy = e.touches[0].clientY - tsy;
            if(Math.abs(dx)>18 || Math.abs(dy)>18) {
                if(Math.abs(dx)>Math.abs(dy)) {
                    if(dx>0) moveRight(); else moveLeft();
                } else {
                    if(dy<0 && !state.jumping && !state.sliding) { state.jumping=true; state.velY=JUMP_FORCE; }
                    else if(dy>0 && !state.jumping && !state.sliding) state.sliding=true;
                }
                swipeDone = true;
            }
            e.preventDefault();
        }, {passive:false});

        function moveLeft() { if(state.lane>0) { state.lane--; state.targetLane=state.lane; } }
        function moveRight() { if(state.lane<2) { state.lane++; state.targetLane=state.lane; } }

        // ============================================================
        // GAME LOOP
        // ============================================================
        let frame = 0;
        let lastTime = performance.now();

        function update(dt) {
            if(!state.alive) return;
            const cDt = Math.min(dt, 0.1);
            frame++;
            if(state.invincible>0) state.invincible--;

            state.distance += state.speed * cDt;
            state.score = Math.floor(state.distance);
            
            // Speed up
            if(state.distance>30) {
                state.speed = state.baseSpeed + (state.distance-30)*0.04;
                state.speed = Math.min(state.speed, state.maxSpeed);
            }

            // Yeti distance
            const yetiSpeed = state.speed * 0.88;
            state.yetiDist += (yetiSpeed - state.speed) * cDt;
            state.yetiDist = Math.max(state.yetiMinDist, Math.min(23, state.yetiDist));

            // Curves
            state.turnTimer -= cDt;
            if(state.turnTimer<=0 && Math.abs(state.targetCurve)<0.1) {
                state.turnTimer = 4 + Math.random()*6;
                state.targetCurve = (Math.random()-0.5)*6;
            }
            state.curveAmount += (state.targetCurve - state.curveAmount)*2*cDt;
            if(Math.abs(state.curveAmount-state.targetCurve)<0.05) state.targetCurve*=0.97;

            // Input
            if(keyJustPressed['ArrowLeft']||keyJustPressed['KeyA']) moveLeft();
            if(keyJustPressed['ArrowRight']||keyJustPressed['KeyD']) moveRight();
            if((keyJustPressed['ArrowUp']||keyJustPressed['KeyW']||keyJustPressed['Space']) && !state.jumping && !state.sliding) {
                state.jumping=true; state.velY=JUMP_FORCE;
            }
            if((keyJustPressed['ArrowDown']||keyJustPressed['KeyS']) && !state.jumping && !state.sliding) state.sliding=true;
            keyJustPressed = {};

            // Player movement
            const targetX = state.lanes[state.targetLane] + state.curveAmount;
            player.position.x += (targetX - player.position.x)*10*cDt;

            // Jump
            if(state.jumping) {
                player.position.y += state.velY*cDt;
                state.velY -= GRAVITY*cDt;
                lThigh.rotation.x = -0.45; rThigh.rotation.x = -0.45;
                if(player.position.y<=state.groundY) {
                    player.position.y=state.groundY; state.jumping=false; state.velY=0;
                    lThigh.rotation.x=0; rThigh.rotation.x=0;
                }
            }

            // Run animation
            if(!state.jumping && !state.sliding) {
                const cycle = performance.now()*0.001*state.speed*0.4;
                lThigh.rotation.x = Math.sin(cycle)*0.5;
                lCalf.rotation.x = Math.sin(cycle)*0.2;
                rThigh.rotation.x = -Math.sin(cycle)*0.5;
                rCalf.rotation.x = -Math.sin(cycle)*0.2;
                lUArm.rotation.x = -Math.sin(cycle)*0.35+0.22;
                rUArm.rotation.x = Math.sin(cycle)*0.35-0.22;
                player.position.y = state.groundY + Math.abs(Math.sin(cycle*2))*0.02;
            }

            // Slide
            if(state.sliding) {
                player.scale.y = 0.4; player.position.y = -0.85;
                if(!keys['ArrowDown']&&!keys['KeyS']) { state.sliding=false; player.scale.y=1; player.position.y=state.groundY; }
            }

            // Contact shadows
            playerShadow.position.set(player.position.x, 0.015, player.position.z);
            playerShadow.scale.setScalar(Math.max(0.4, 1-player.position.y*0.15));
            yetiShadow.position.set(yeti.position.x, 0.015, yeti.position.z);

            // Yeti position
            yeti.position.z = player.position.z - state.yetiDist;
            yeti.position.x += (player.position.x*0.8 - yeti.position.x)*5*cDt;
            yeti.position.y = 0;
            lYetiArm.rotation.z = 0.45 + Math.sin(performance.now()*0.004)*0.25;
            rYetiArm.rotation.z = -0.45 - Math.sin(performance.now()*0.004+1)*0.25;
            lYetiLeg.rotation.x = Math.sin(performance.now()*0.005)*0.3;
            rYetiLeg.rotation.x = -Math.sin(performance.now()*0.005)*0.3;

            // Move street
            const move = state.speed*cDt;
            for(let seg of segments) {
                seg.position.z += move;
                seg.position.x = Math.sin(seg.position.z*0.012+state.distance*0.0015)*3 + state.curveAmount*0.4;
                if(seg.position.z>SEG_LEN) seg.position.z -= NUM_SEG*SEG_LEN;
            }
            for(let b of allBuildings) { b.position.z+=move; if(b.position.z>15) b.position.z-=NUM_SEG*SEG_LEN+30; }
            for(let l of allLamps) { l.position.z+=move; if(l.position.z>15) l.position.z-=NUM_SEG*SEG_LEN+30; }
            for(let f of allDecor) { f.rotation.z = Math.sin(performance.now()*0.0015+f.userData.sway)*0.15; }

            // Move obstacles
            for(let obs of obstacles) {
                obs.mesh.position.z += move; obs.z = obs.mesh.position.z;
                obs.mesh.position.x = obs.x + Math.sin(obs.z*0.012+state.distance*0.0015)*3 + state.curveAmount*0.4;
            }
            for(let i=obstacles.length-1; i>=0; i--) {
                if(obstacles[i].z>12) { scene.remove(obstacles[i].mesh); obstacles.splice(i,1); }
            }

            // Move coins
            for(let coin of coins) {
                coin.mesh.position.z += move; coin.z = coin.mesh.position.z;
                coin.mesh.rotation.z += 2.5*cDt;
                coin.mesh.position.y = coin.baseY + Math.sin(performance.now()*0.004+coin.phase)*0.12;
            }
            for(let i=coins.length-1; i>=0; i--) {
                if(coins[i].z>12 || coins[i].collected) { scene.remove(coins[i].mesh); coins.splice(i,1); }
            }

            // Spawn
            if(Math.random() < Math.max(0.4, 3-state.speed*0.06)*cDt) {
                addObstacle(state.lanes[Math.floor(Math.random()*3)], -NUM_SEG*SEG_LEN+5);
            }
            if(Math.random() < 2.8*cDt) {
                const l = Math.floor(Math.random()*3);
                addCoin(state.lanes[l]+(Math.random()-0.5)*2, 1.2+Math.random()*1.4, -NUM_SEG*SEG_LEN+5);
            }
            if(frame%22===0 && Math.random()>0.35) {
                const l = Math.floor(Math.random()*3);
                for(let i=0; i<6; i++) addCoin(state.lanes[l], 1.5, -NUM_SEG*SEG_LEN+5+i*1.5);
            }

            // Collision
            const px = player.position.x, py = player.position.y, pz = player.position.z;
            const pBot = state.sliding ? -0.85 : py;
            const pTop = state.sliding ? -0.25 : py + 2.7;

            for(let obs of obstacles) {
                const dx = Math.abs(px - obs.mesh.position.x);
                const dz = Math.abs(pz - obs.z);
                if(dx < obs.w/2+0.25 && dz < 0.5) {
                    if(state.jumping && pBot > obs.h-0.1) continue;
                    if(pTop > obs.h*0.3 && state.invincible<=0) {
                        state.alive = false;
                        endGame();
                        return;
                    }
                }
                if(!obs.passed && obs.z>pz+1) { obs.passed=true; state.score+=10; }
            }

            // Yeti catch
            if(state.yetiDist < state.yetiMinDist) { state.alive=false; endGame(); return; }

            // Coin collect
            for(let coin of coins) {
                if(coin.collected) continue;
                if(Math.abs(px-coin.x)<0.5 && Math.abs((py+1.3)-coin.mesh.position.y)<0.7 && Math.abs(pz-coin.z)<0.5) {
                    coin.collected=true; state.coins++; state.score+=15;
                }
            }

            // Camera
            camera.position.x += (player.position.x*0.3 - camera.position.x)*4*cDt;
            camera.position.y += (8.5+player.position.y - camera.position.y)*4*cDt;
            camera.lookAt(player.position.x*0.2, 2.3, player.position.z-7);

            // UI
            document.getElementById('score').textContent = Math.floor(state.score);
            document.getElementById('coins').textContent = state.coins;
        }

        function endGame() {
            const fs = Math.floor(state.score);
            if(fs > state.bestScore) {
                state.bestScore = fs;
                localStorage.setItem('ktmBest', state.bestScore);
            }
            document.getElementById('fs').textContent = fs+'m';
            document.getElementById('fc').textContent = state.coins;
            document.getElementById('bs').textContent = state.bestScore+'m';
            document.getElementById('gameover').classList.add('show');
        }

        function animate(ts) {
            requestAnimationFrame(animate);
            const dt = (ts - lastTime)/1000;
            lastTime = ts;
            if(dt>0 && dt<0.5) update(dt);
            composer.render();
        }

        window.addEventListener('resize', () => {
            camera.aspect = innerWidth/innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
            composer.setSize(innerWidth, innerHeight);
            bloomPass.setSize(innerWidth, innerHeight);
        });

        requestAnimationFrame(animate);
        const loadingEl = document.getElementById('loading');
        loadingEl.style.opacity = '0';
        setTimeout(() => loadingEl.remove(), 650);
        console.log('🏔️ Kathmandu Run Ready!');
        console.log('Arrow Keys/WASD to move, Space to jump, Down to slide');
        console.log('Mobile: Swipe to play');
    </script>
</body>
</html>
